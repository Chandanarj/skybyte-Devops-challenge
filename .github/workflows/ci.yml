name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Python setup
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # Install dependencies
      - name: Install dependencies
        run: pip install -r app/requirements.txt pytest flake8

      # Lint Python
      - name: Lint Python
        run: flake8 app/

      # Run tests
      - name: Run tests
        run: PYTHONPATH=. pytest

      # Docker build
      - name: Build Docker image
        run: docker build -t skybyte/app:ci .

      # Setup Helm
      - name: Setup Helm
        uses: azure/setup-helm@v4

      # Helm lint
      - name: Helm lint
        run: helm lint helm/skybyte-app

      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Terraform validate
      - name: Terraform validate
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate